<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17152a">
<meta name="description" content="夕方のまちを歩く地域猫のサビを操作して、カリカリを集めてゴハンまで進むドット絵アクションゲーム。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>サビ猫アドベンチャー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
html { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
body { margin: 0; }
</style>
<style>
/* Layout: HUD bar, a 16:9 pixel stage, thumb pad under it on touch screens.
   A single committed night-street look; the game art carries the colour. */
:root {
  --bg: #17152a;
  --panel: #221f3a;
  --line: #3a3560;
  --ink: #fdf3e1;
  --muted: #b4acd0;
  --accent: #e2802c;
  --kibble: #b0682c;
  --font: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  padding-inline: 16px;
  padding-block: 10px;
  box-sizing: border-box;
}
.app {
  height: 100%;
  max-width: 980px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.hud {
  width: min(100%, calc((100dvh - 150px) * 16 / 9));
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 4px 16px;
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 6px 12px;
  box-sizing: border-box;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}
.hud b { color: var(--accent); font-weight: normal; margin-right: 6px; }
.hud button {
  font: inherit;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--line);
  padding: 2px 10px;
  cursor: pointer;
}
.hud button:focus-visible, .btn:focus-visible, .pad button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stage {
  position: relative;
  width: min(100%, calc((100dvh - 150px) * 16 / 9));
  aspect-ratio: 16 / 9;
  border: 2px solid var(--line);
  box-sizing: border-box;
  background: #000;
}
canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  text-align: center;
  background: rgba(14, 11, 30, 0.78);
}
.overlay[hidden] { display: none; }
.overlay h1 { margin: 0; font-weight: normal; font-size: clamp(22px, 5vw, 42px); letter-spacing: 0.08em; text-wrap: balance; }
.overlay p { margin: 0; max-width: 34em; color: var(--muted); line-height: 1.7; font-size: clamp(12px, 2.2vw, 16px); text-wrap: balance; }
.overlay .big { color: var(--ink); font-size: clamp(16px, 3vw, 24px); }
.btn {
  font: inherit;
  font-size: clamp(15px, 2.6vw, 20px);
  color: #1c1208;
  background: var(--accent);
  border: 0;
  padding: 10px 28px;
  cursor: pointer;
  box-shadow: 0 4px 0 #8a4a14;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a4a14; }
.pad { display: none; width: min(100%, 560px); justify-content: space-between; gap: 12px; user-select: none; -webkit-user-select: none; touch-action: none; }
.pad .dirs { display: flex; gap: 12px; }
.pad button {
  font: inherit; font-size: 26px; color: var(--ink);
  width: 78px; height: 78px; background: var(--panel); border: 2px solid var(--line);
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
.pad button.on { background: var(--accent); color: #1c1208; }
.pad .jump { width: 120px; font-size: 18px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; max-width: 46em; text-wrap: balance; }
@media (pointer: coarse) {
  .pad { display: flex; }
  .hint.kbd { display: none; }
}
@media (pointer: fine) { .hint.touch { display: none; } }
@media (max-width: 520px) {
  body { font-size: 13px; }
  .hud { padding: 4px 8px; }
}
</style>
</head>
<body>

<main class="app">
  <header class="hud" aria-live="off">
    <span><b>サビ</b><span id="hScore">000000</span></span>
    <span><b>カリカリ</b>×<span id="hKib">0</span></span>
    <span><b>ライフ</b><span id="hLife">♥♥♥</span></span>
    <span><b>のこり</b><span id="hTime">300</span></span>
    <button id="mute" type="button" aria-pressed="false">おと ON</button>
  </header>
  <div class="stage">
    <canvas id="c" width="256" height="144" aria-label="サビ猫アドベンチャーのゲーム画面"></canvas>
    <div id="overlay" class="overlay"></div>
  </div>
  <div class="pad" id="pad">
    <div class="dirs">
      <button type="button" data-k="left" aria-label="左へ">◀</button>
      <button type="button" data-k="right" aria-label="右へ">▶</button>
    </div>
    <button type="button" class="jump" data-k="jump" aria-label="ジャンプ">ジャンプ</button>
  </div>
  <p class="hint kbd">← → で移動、スペースでジャンプ。ネズミは上から踏むとやっつけられます。ハテナ箱は下から頭突きするとカリカリが出ます。</p>
  <p class="hint touch">ネズミは上から踏むとやっつけられます。ハテナ箱は下から頭突きするとカリカリが出ます。</p>
</main>

<script>
(() => {
'use strict';
const W = 256, H = 144, GY = 112, WORLD = 1100, GOAL = 965;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- sprites ---------- */
const PAL = { O:'#e2802c', K:'#18181f', D:'#c46414', W:'#fcfcfc', P:'#fc788c', G:'#9696a5', E:'#c8ec3c', T:'#b0682c', R:'#d82828', B:'#fcd800' };
function mk(rows) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } }));
  return c;
}
const BODY = [
  "..........KK.KO.",
  "..........KKKOKO",
  "..........KOEOEP",
  "K.........KOOKOO",
  "K..KKOKKOOKKOO..",
  "KKOKKOOKKKOOKO..",
  "KOOKKOKKOOOKOK..",
  ".OKKOOKKOKKOOO..",
  "..OKOKKOOKOOK...",
];
const LEGS = {
  A: ["..OK.KO..OK.OK..", "..OK.KO..OK.OK..", "..DD.DD..DD.DD.."],
  B: ["...OK.KO...OK.OK", "...OK.KO...OK.OK", "...DD.DD...DD.DD"],
  J: [".OK.OK....OK.OK.", "OK...........OOK", "DD...........DDD"],
  S: ["..OK.KO..OK.OK..", "..OKKOOKOOKOOK..", "..DDDDDDDDDDDD.."],
};
const CAT = {};
for (const k in LEGS) CAT[k] = mk(BODY.concat(LEGS[k]).map(r => r.padEnd(16, '.').slice(0, 16)));
const MOUSE = {
  A: mk(["......GG.GG.", ".....GGGGGGG", "P...GGGGKGGP", "PP.GGGGGGGGG", ".PGGGGGGGGG.", "..GGGGGGGGG.", "..GG.GG.GG..", "..KK.KK.KK.."]),
  B: mk(["......GG.GG.", ".....GGGGGGG", "P...GGGGKGGP", "PP.GGGGGGGGG", ".PGGGGGGGGG.", "..GGGGGGGGG.", "..G.GG.GG.G.", "..K.KK.KK.K."]),
  F: mk(["............", "............", "............", "............", "............", "PPGGGGGGGGGP", "GGGGGGKGGGGG", "KKKKKKKKKKKK"]),
};
const HEART = mk([".PP.PP.", "PPPPPPP", "PPPPPPP", ".PPPPP.", "..PPP..", "...P..."]);
const BOWL = mk(["...TTT.....", "..TTTTTT...", "RRRRRRRRRRR", ".RRRRRRRRR.", "..RRRRRRR.."]);
const QG = ["..###.", ".#...#", ".....#", "...##.", "...#..", "......", "...#.."];
const DIG = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
  '5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111','+':'000010111010000',
};
function drawSpr(c, x, y, flip) {
  x = Math.round(x); y = Math.round(y);
  if (flip) { ctx.save(); ctx.translate(x + c.width, y); ctx.scale(-1, 1); ctx.drawImage(c, 0, 0); ctx.restore(); }
  else ctx.drawImage(c, x, y);
}
function drawNum(str, x, y, col) {
  for (const pass of [1, 0]) {
    let cx = x;
    for (const ch of str) {
      const g = DIG[ch]; if (!g) continue;
      for (let i = 0; i < 15; i++) if (g[i] === '1') {
        ctx.fillStyle = pass ? '#000' : col;
        ctx.fillRect(cx + (i % 3) + pass, y + ((i / 3) | 0) + pass, 1, 1);
      }
      cx += 4;
    }
  }
}
function disc(cx, cy, rw, rh, col) {
  ctx.fillStyle = col;
  for (let dy = -rh; dy <= rh; dy++) {
    const half = Math.round(rw * Math.sqrt(1 - (dy / rh) * (dy / rh)));
    ctx.fillRect(cx - half, cy + dy, half * 2, 1);
  }
}
const R = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

/* ---------- background ---------- */
const SKY = document.createElement('canvas'); SKY.width = W; SKY.height = H;
{ const g = SKY.getContext('2d');
  for (let y = 0; y < H; y++) { const u = Math.min(y / GY, 1);
    g.fillStyle = `rgb(${110 + 142 * u | 0},${150 + 54 * u | 0},${224 - 60 * u | 0})`; g.fillRect(0, y, W, 1); } }
const BCOL = ['#786e96', '#96788a', '#6e8296', '#8c8278', '#646e8c'];
function shade(hex, d) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, v + d)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function building(x, base, w, h, col, win, seed) {
  x = Math.round(x);
  R(x, base - h, w, h, col); R(x, base - h, w, 2, shade(col, 25));
  if (win) for (let wy = base - h + 6; wy < base - 6; wy += 9) for (let wx = x + 4; wx < x + w - 4; wx += 7) {
    const lit = ((wx * 7 + wy * 13 + seed) % 5 + 5) % 5 < 2;
    R(wx, wy, 3, 5, lit ? '#fce078' : shade(col, -30));
  }
}
const WALLS = [[0, 200], [360, 520], [600, 790], [850, 1000]];
const GUTTERS = [[304, 336], [704, 736]];
const VENDS = [[236, '#d82828'], [560, '#2864d8'], [900, '#d82828']];
function drawBackground(cam) {
  ctx.drawImage(SKY, 0, 0);
  for (const cx of [30, 190, 360]) {
    const x = ((cx - cam * 0.1) % 420 + 420) % 420 - 40, y = 14 + (cx % 3) * 9;
    disc(Math.round(x), y, 14, 4, '#ffe4d0'); disc(Math.round(x) + 8, y - 3, 9, 3, '#ffe4d0'); disc(Math.round(x) - 9, y + 2, 9, 3, '#ffe4d0');
  }
  const f0 = Math.floor(cam * 0.2 / 30) - 1;
  for (let i = f0; i < f0 + 11; i++) building(i * 30 - cam * 0.2, GY, 28, 40 + (((i * 53) % 6) + 6) % 6 * 9, '#9694be', false, 0);
  const m0 = Math.floor(cam * 0.45 / 46) - 1;
  for (let i = m0; i < m0 + 7; i++) {
    const ii = (i % 5 + 5) % 5, w = 36 + ((i * 17) % 3 + 3) % 3 * 4, h = 36 + ((i * 37) % 5 + 5) % 5 * 9;
    const bx = i * 46 - cam * 0.45;
    building(bx, GY, w, h, BCOL[ii], true, i);
    if (((i % 3) + 3) % 3 === 0) R(bx + 8, GY - h - 8, 8, 8, '#5a5a64');
    if (((i % 4) + 4) % 4 === 1) { R(bx + 4, GY - 14, w - 8, 8, '#f05a46'); R(bx + 6, GY - 10, w - 12, 1, '#fcf0c8'); }
  }
  for (const [x0, x1] of WALLS) {
    const s0 = x0 - cam, s1 = x1 - cam; if (s1 < 0 || s0 > W) continue;
    R(s0, 90, x1 - x0, GY - 90, '#b2b0aa'); R(s0, 90, x1 - x0, 3, '#82807c');
    for (let yy = 98; yy < GY; yy += 8) R(s0, yy, x1 - x0, 1, '#82807c');
    for (let r = 0, yy = 92; yy < GY; yy += 8, r++) for (let xx = x0 + (r % 2 ? 8 : 0); xx < x1; xx += 16) R(xx - cam, yy, 1, 8, '#82807c');
    for (let gx = x0 + 20; gx < x1 - 20; gx += 60) for (const dx of [-6, 0, 6]) disc(gx + dx - cam, 88, 6, 5, '#469646');
  }
  const poles = []; for (let k = 0; k < 10; k++) poles.push(40 + 128 * k);
  ctx.fillStyle = '#282434';
  poles.forEach((px, k) => {
    if (k + 1 >= poles.length) return;
    const sx = px - cam, nx = poles[k + 1] - cam; if (nx < -10 || sx > W + 10) return;
    for (const wy of [46, 52]) for (let x = Math.round(sx); x <= Math.round(nx); x++) {
      const u = (x - sx) / (nx - sx); ctx.fillRect(x, Math.round(wy + 36 * u * (1 - u)), 1, 1);
    }
  });
  for (const px of poles) {
    const sx = px - cam; if (sx < -10 || sx > W + 10) continue;
    R(sx, 40, 3, GY - 40, '#50382c'); R(sx - 6, 44, 15, 2, '#50382c'); R(sx - 4, 50, 11, 2, '#50382c');
  }
  for (const [vx, col] of VENDS) {
    const sx = vx - cam; if (sx < -20 || sx > W + 20) continue;
    R(sx, GY - 26, 14, 26, '#000'); R(sx + 1, GY - 25, 12, 24, col); R(sx + 2, GY - 23, 10, 11, '#fcfcdc');
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) R(sx + 3 + c * 3, GY - 22 + r * 3, 2, 2, (r + c) % 2 ? '#f0783c' : '#64bef0');
    R(sx + 4, GY - 8, 6, 3, '#1e1e1e');
  }
  R(0, GY, W, 4, '#cecac6'); R(0, GY + 4, W, 1, '#78766f'); R(0, GY + 5, W, H - GY - 5, '#4e4e5a');
  for (let dx = Math.floor(cam / 32) * 32 - 32; dx < cam + W + 32; dx += 32) R(dx - cam, 130, 14, 2, '#f0f0dc');
  for (const [g0, g1] of GUTTERS) {
    const gx = g0 - cam; if (gx > W || gx + 32 < 0) continue;
    R(gx, GY, g1 - g0, H - GY, '#18181e');
    for (let xx = gx + 2; xx < gx + (g1 - g0); xx += 4) R(xx, GY + 1, 1, H - GY, '#464652');
  }
}

/* ---------- audio ---------- */
let actx = null, master = null, muted = false, musicOn = false, nextBar = 0, musicTimer = 0;
try { muted = localStorage.getItem('sabi-muted') === '1'; } catch (e) {}
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(actx.destination);
  } catch (e) { actx = null; }
}
const mid = n => 440 * Math.pow(2, (n - 69) / 12);
function tone(f, t, d, type, vol, to) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
const MEL = [[76,79,76,72,74,76,74,0],[72,76,79,76,81,79,76,0],[77,81,77,74,76,79,76,72],[74,76,77,74,72,72,0,0]];
const BASS = [48, 48, 53, 55];
function scheduleMusic() {
  if (!actx || !musicOn) return;
  while (nextBar < actx.currentTime + 0.6) {
    const bar = scheduleMusic.bar++ % 4;
    MEL[bar].forEach((n, i) => { if (n) tone(mid(n), nextBar + i * 0.2, 0.18, 'square', 0.05); });
    for (let q = 0; q < 4; q++) tone(mid(q % 2 ? BASS[bar] + 7 : BASS[bar]), nextBar + q * 0.4, 0.36, 'triangle', 0.12);
    nextBar += 1.6;
  }
}
scheduleMusic.bar = 0;
function startMusic() {
  if (!actx || musicOn) return;
  musicOn = true; nextBar = actx.currentTime + 0.1; scheduleMusic.bar = 0;
  musicTimer = setInterval(scheduleMusic, 150);
}
function stopMusic() { musicOn = false; clearInterval(musicTimer); }
const sfx = {
  jump() { if (actx) tone(300, actx.currentTime, 0.18, 'square', 0.08, 1200); },
  coin() { if (actx) { const t = actx.currentTime; tone(988, t, 0.07, 'square', 0.09); tone(1319, t + 0.07, 0.4, 'square', 0.09); } },
  stomp() { if (actx) tone(520, actx.currentTime, 0.12, 'square', 0.1, 120); },
  hurt() { if (actx) tone(400, actx.currentTime, 0.4, 'sawtooth', 0.09, 70); },
  win() { if (actx) [72, 76, 79, 84].forEach((n, i) => tone(mid(n), actx.currentTime + i * 0.12, 0.3, 'square', 0.08)); },
  over() { if (actx) [67, 64, 60, 55].forEach((n, i) => tone(mid(n), actx.currentTime + i * 0.2, 0.3, 'triangle', 0.14)); },
};
document.addEventListener('visibilitychange', () => {
  if (!actx) return;
  if (document.hidden) actx.suspend(); else actx.resume();
});

/* ---------- state ---------- */
const keys = { left: false, right: false, jump: false };
let state = 'title', cat, cam, score, kib, lives, timeLeft, checkpoint, boxes, mice, parts, pops, hearts, clock, winAt, best = 0, hudCache = '';
try { best = +localStorage.getItem('sabi-best') || 0; } catch (e) {}

function newLevel() {
  boxes = [
    [424, 76], [456, 76], [488, 76], [600, 76], [780, 76], [812, 60],
  ].map(([x, y]) => ({ x, y, used: false, bump: 0 }));
  mice = [
    { x: 210, a: 150, b: 270, dir: -1, squash: 0 },
    { x: 560, a: 520, b: 620, dir: -1, squash: 0 },
    { x: 660, a: 630, b: 690, dir: 1, squash: 0 },
    { x: 880, a: 840, b: 940, dir: -1, squash: 0 },
  ];
  parts = []; pops = []; hearts = [];
  score = 0; kib = 0; lives = 3; timeLeft = 300; checkpoint = 40; clock = 0; winAt = 0;
  spawn();
}
function spawn() {
  cat = { x: checkpoint, y: GY - 12, vx: 0, vy: 0, face: 1, ground: true, coyote: 0, buf: 0, inv: 0, cut: false, jumpHeld: false };
  cam = Math.max(0, Math.min(WORLD - W, Math.round(cat.x - 96)));
}
const inGutter = cx => GUTTERS.some(([a, b]) => cx > a + 1 && cx < b - 1);
function hurt(fell) {
  if (state !== 'play') return;
  lives--; sfx.hurt();
  if (lives <= 0) return gameOver(fell ? 'みぞに落ちてしまった…' : 'ネズミにやられてしまった…');
  spawn(); cat.inv = 1.6;
}
function popText(x, y, s) { pops.push({ x, y, s, t: 0 }); }
function hitBox(b) {
  if (b.used) return;
  b.used = true; b.bump = 0.15; kib++; score += 100; sfx.coin(); popText(b.x + 4, b.y - 8, '+100');
  for (let i = 0; i < 6; i++) parts.push({ x: b.x + 7, y: b.y - 2, vx: (i - 2.5) * 14, vy: -90 - (i % 3) * 18, t: 0 });
}

function update(dt) {
  if (state !== 'play' && state !== 'win') { return; }
  clock += dt;
  for (const b of boxes) if (b.bump > 0) b.bump -= dt;
  for (const p of parts) { p.t += dt; p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.t < 0.9);
  for (const p of pops) p.t += dt;
  pops = pops.filter(p => p.t < 1);
  if (state === 'win') {
    cat.vx = 0; cat.face = 1;
    if (Math.random() < dt * 2.5) hearts.push({ x: cat.x + 8 + Math.random() * 10, y: cat.y, t: 0 });
    for (const h of hearts) { h.t += dt; h.y -= 14 * dt; }
    hearts = hearts.filter(h => h.t < 2.2);
    if (clock - winAt > 1.6 && overlay.hidden) showOverlay('win');
    return;
  }
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; return gameOver('じかんぎれ…'); }
  if (cat.inv > 0) cat.inv -= dt;
  const c = cat;
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const target = dir * 82, acc = dir ? 760 : 900;
  if (c.vx < target) c.vx = Math.min(target, c.vx + acc * dt); else if (c.vx > target) c.vx = Math.max(target, c.vx - acc * dt);
  if (dir) c.face = dir;
  if (keys.jump && !c.jumpHeld) c.buf = 0.12;
  c.jumpHeld = keys.jump;
  c.buf -= dt;
  c.coyote = c.ground ? 0.09 : c.coyote - dt;
  if (c.buf > 0 && c.coyote > 0) { c.vy = -232; c.ground = false; c.coyote = 0; c.buf = 0; c.cut = false; sfx.jump(); }
  if (!keys.jump && c.vy < -110 && !c.cut) { c.vy *= 0.5; c.cut = true; }
  c.vy = Math.min(c.vy + 620 * dt, 320);

  // horizontal
  let nx = c.x + c.vx * dt;
  nx = Math.max(cam - 2, Math.min(WORLD - 14, nx));
  for (const b of boxes) {
    const top = c.y + 1, bot = c.y + 12;
    if (top < b.y + 16 && bot > b.y + 0.5 && nx + 14 > b.x && nx + 2 < b.x + 16) {
      if (c.vx > 0 || c.x + 8 < b.x + 8) nx = b.x - 14; else nx = b.x + 16 - 2;
      c.vx = 0;
    }
  }
  c.x = nx;

  // vertical
  const prevBottom = c.y + 12, prevTop = c.y + 1;
  let ny = c.y + c.vy * dt, landed = false;
  const L = c.x + 2, Rr = c.x + 14;
  if (c.vy >= 0) {
    const nb = ny + 12;
    for (const b of boxes) if (Rr > b.x && L < b.x + 16 && prevBottom <= b.y + 0.01 && nb >= b.y) { ny = b.y - 12; landed = true; }
    if (!landed && !inGutter(c.x + 8) && prevBottom <= GY + 0.01 && nb >= GY) { ny = GY - 12; landed = true; }
    if (landed) c.vy = 0;
  } else {
    const nt = ny + 1;
    for (const b of boxes) if (Rr > b.x + 1 && L < b.x + 15 && prevTop >= b.y + 15.99 && nt <= b.y + 16) { ny = b.y + 15; c.vy = 20; hitBox(b); }
  }
  c.y = ny; c.ground = landed;
  if (c.y > H + 10) return hurt(true);

  if (c.x >= 620 && checkpoint < 600) checkpoint = 600;
  if (c.x >= GOAL) {
    state = 'win'; winAt = clock; sfx.win(); stopMusic();
    score += Math.floor(timeLeft) * 10;
    try { if (score > best) { best = score; localStorage.setItem('sabi-best', String(best)); } } catch (e) {}
    c.vx = 0;
    return;
  }

  // mice
  for (const m of mice) {
    if (m.squash > 0) { m.squash -= dt; if (m.squash <= 0) m.squash = -1; continue; }
    if (m.squash < 0) continue;
    m.x += m.dir * 22 * dt;
    if (m.x < m.a) { m.x = m.a; m.dir = 1; } else if (m.x > m.b) { m.x = m.b; m.dir = -1; }
    const mx = m.x + 1, my = GY - 7, mw = 10, mh = 7;
    if (c.inv <= 0 && c.x + 14 > mx && c.x + 2 < mx + mw && c.y + 12 > my && c.y + 1 < my + mh) {
      if (c.vy > 0 && prevBottom <= my + 3) {
        m.squash = 0.4; c.vy = -150; c.ground = false; score += 200; sfx.stomp(); popText(m.x, GY - 18, '+200');
      } else { hurt(false); return; }
    }
  }
  const target2 = Math.max(0, Math.min(WORLD - W, Math.round(c.x - 96)));
  if (target2 > cam) cam = target2;
}

/* ---------- render ---------- */
function render() {
  drawBackground(cam);
  // bowl + house
  drawSpr(BOWL, 975 - cam, GY - 5);
  const hx = Math.round(1010 - cam);
  if (hx > -60 && hx < W + 10) {
    R(hx, GY - 30, 41, 30, '#000'); R(hx + 1, GY - 29, 39, 29, '#f4f0e4');
    for (let r = 0; r < 20; r++) { const w = 48 - Math.round(r * 2.4); R(hx - 4 + Math.round(r * 1.2), GY - 31 - r, w, 1, r === 0 ? '#000' : '#465a82'); }
    R(hx + 15, GY - 18, 11, 18, '#000'); R(hx + 16, GY - 17, 9, 17, '#884c00');
    R(hx + 4, GY - 24, 8, 7, '#000'); R(hx + 5, GY - 23, 6, 5, '#fce078');
    R(hx + 29, GY - 24, 8, 7, '#000'); R(hx + 30, GY - 23, 6, 5, '#fce078');
  }
  // boxes
  for (const b of boxes) {
    const bx = Math.round(b.x - cam), by = Math.round(b.y - (b.bump > 0 ? 4 : 0));
    if (bx < -20 || bx > W + 4) continue;
    R(bx, by, 16, 16, '#50300f');
    if (b.used) {
      R(bx + 1, by + 1, 14, 14, '#aa7c48');
      R(bx + 1, by - 3, 4, 3, '#c49660'); R(bx + 11, by - 3, 4, 3, '#c49660');
    } else {
      R(bx + 1, by + 1, 14, 14, '#d6a460'); R(bx + 7, by + 1, 2, 14, '#b08246'); R(bx + 1, by + 1, 14, 2, '#ecc48c');
      QG.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '#') R(bx + 4 + x, by + 4 + y, 1, 1, '#fcfcfc'); }));
    }
  }
  // mice
  for (const m of mice) {
    if (m.squash < 0) continue;
    const sp = m.squash > 0 ? MOUSE.F : (Math.floor(clock / 0.15) % 2 ? MOUSE.B : MOUSE.A);
    drawSpr(sp, m.x - cam, GY - 8, m.dir < 0);
  }
  // kibble
  for (const p of parts) { R(p.x - cam, p.y, 2, 2, '#b0682c'); R(p.x - cam, p.y, 1, 1, '#dc9650'); }
  // cat
  const c = cat;
  if (c.inv <= 0 || Math.floor(c.inv / 0.08) % 2 === 0) {
    let legs = 'S';
    if (!c.ground) legs = 'J';
    else if (state === 'play' && Math.abs(c.vx) > 8) legs = Math.floor(clock / 0.11) % 2 ? 'B' : 'A';
    const bob = state === 'win' && Math.floor(clock / 0.25) % 2 ? 1 : 0;
    drawSpr(CAT[legs], c.x - cam, c.y + bob, c.face < 0);
  }
  for (const h of hearts) drawSpr(HEART, h.x - cam, h.y);
  for (const p of pops) drawNum(p.s, Math.round(p.x - cam), Math.round(p.y - p.t * 14), '#ffffff');
}

/* ---------- HUD & overlay ---------- */
const $ = id => document.getElementById(id);
const overlay = $('overlay');
function hud() {
  const s = String(score || 0).padStart(6, '0'), k = String(kib || 0), l = '♥'.repeat(Math.max(lives || 0, 0)) + '♡'.repeat(Math.max(3 - (lives || 0), 0)), t = String(Math.ceil(timeLeft || 300));
  const sig = s + k + l + t;
  if (sig === hudCache) return; hudCache = sig;
  $('hScore').textContent = s; $('hKib').textContent = k; $('hLife').textContent = l; $('hTime').textContent = t;
}
function showOverlay(kind) {
  overlay.hidden = false;
  const bestLine = best ? `<p>ベストスコア ${String(best).padStart(6, '0')}</p>` : '';
  if (kind === 'title') {
    overlay.innerHTML = `<h1>サビ猫アドベンチャー</h1>
      <p>夕方のまちを歩く地域猫のサビ。ネズミをよけ、みぞを飛びこえ、ハテナ箱からカリカリを集めて、ゴハンのお皿までたどり着こう。</p>
      ${bestLine}<button class="btn" id="go" type="button">スタート</button>`;
  } else if (kind === 'win') {
    overlay.innerHTML = `<h1>ゴハン ゲット！</h1>
      <p class="big">スコア ${String(score).padStart(6, '0')}　カリカリ ×${kib}</p>
      <p>ベストスコア ${String(best).padStart(6, '0')}</p><button class="btn" id="go" type="button">もういっかい</button>`;
  } else {
    overlay.innerHTML = `<h1>ゲームオーバー</h1><p>${kind.msg}</p>
      <p class="big">スコア ${String(score).padStart(6, '0')}</p><button class="btn" id="go" type="button">もういっかい</button>`;
  }
  const go = $('go'); go.addEventListener('click', startGame); go.focus({ preventScroll: true });
}
function gameOver(msg) {
  state = 'over'; stopMusic(); sfx.over();
  try { if (score > best) { best = score; localStorage.setItem('sabi-best', String(best)); } } catch (e) {}
  showOverlay({ msg });
}
function startGame() {
  initAudio(); newLevel(); state = 'play'; overlay.hidden = true; hudCache = '';
  musicOn = false; clearInterval(musicTimer); startMusic();
  keys.left = keys.right = keys.jump = false;
}

/* ---------- input ---------- */
const MAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump' };
addEventListener('keydown', e => {
  const k = MAP[e.code];
  if (!k) return;
  e.preventDefault();
  if (!overlay.hidden) { if (e.code === 'Space' || e.code === 'Enter') startGame(); return; }
  keys[k] = true;
});
addEventListener('keyup', e => { const k = MAP[e.code]; if (k) { keys[k] = false; } });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });
document.querySelectorAll('.pad button').forEach(btn => {
  const k = btn.dataset.k;
  const on = e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); keys[k] = true; btn.classList.add('on'); };
  const off = () => { keys[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off); btn.addEventListener('pointercancel', off); btn.addEventListener('lostpointercapture', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
const muteBtn = $('mute');
function applyMute() {
  muteBtn.textContent = muted ? 'おと OFF' : 'おと ON'; muteBtn.setAttribute('aria-pressed', String(muted));
  if (master) master.gain.value = muted ? 0 : 0.5;
}
muteBtn.addEventListener('click', () => {
  muted = !muted; try { localStorage.setItem('sabi-muted', muted ? '1' : '0'); } catch (e) {}
  applyMute(); muteBtn.blur();
});
applyMute();

/* ---------- loop ---------- */
newLevel(); state = 'title'; showOverlay('title');
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= 1 / 60) { update(1 / 60); acc -= 1 / 60; }
  if (state === 'title') clock += 1 / 60;
  render(); hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
