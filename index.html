<!doctype html>
<html lang="ja">

<style>
html { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
body { margin: 0; touch-action: manipulation; }
</style>
<style>
/* Layout: HUD bar, a 16:9 pixel stage, thumb pad under it on touch screens.
   A single committed night-street look; the game art carries the colour. */
:root {
  --bg: #17152a;
  --panel: #221f3a;
  --line: #3a3560;
  --ink: #fdf3e1;
  --muted: #b4acd0;
  --accent: #e2802c;
  --kibble: #b0682c;
  --font: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  padding-inline: 16px;
  padding-block: 10px;
  box-sizing: border-box;
}
.app {
  height: 100%;
  max-width: 980px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.hud {
  width: min(100%, calc((100dvh - 150px) * 16 / 9));
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 4px 16px;
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 6px 12px;
  box-sizing: border-box;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}
.hud b { color: var(--accent); font-weight: normal; margin-right: 6px; }
.hud button {
  font: inherit;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--line);
  padding: 2px 10px;
  cursor: pointer;
}
.hud button:focus-visible, .btn:focus-visible, .pad button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stage {
  position: relative;
  width: min(100%, calc((100dvh - 150px) * 16 / 9));
  aspect-ratio: 16 / 9;
  border: 2px solid var(--line);
  box-sizing: border-box;
  background: #000;
}
canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  text-align: center;
  background: rgba(14, 11, 30, 0.78);
}
.overlay[hidden] { display: none; }
.overlay h1 { margin: 0; font-weight: normal; font-size: clamp(22px, 5vw, 42px); letter-spacing: 0.08em; text-wrap: balance; }
.overlay p { margin: 0; max-width: 34em; color: var(--muted); line-height: 1.7; font-size: clamp(12px, 2.2vw, 16px); text-wrap: balance; }
.overlay .big { color: var(--ink); font-size: clamp(16px, 3vw, 24px); }
.btn {
  font: inherit;
  font-size: clamp(15px, 2.6vw, 20px);
  color: #1c1208;
  background: var(--accent);
  border: 0;
  padding: 10px 28px;
  cursor: pointer;
  box-shadow: 0 4px 0 #8a4a14;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a4a14; }
.overlay .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.btn.sm { font-size: clamp(12px, 2.2vw, 16px); padding: 8px 14px; }
.btn:disabled { background: #4a4666; color: #8a84a8; box-shadow: 0 4px 0 #34304c; cursor: default; }
.btn:disabled:active { transform: none; }
.pad { display: none; width: min(100%, 560px); justify-content: space-between; gap: 12px; user-select: none; -webkit-user-select: none; touch-action: none; }
.pad .dirs { display: flex; gap: 12px; }
.pad button {
  font: inherit; font-size: 26px; color: var(--ink);
  width: 78px; height: 78px; background: var(--panel); border: 2px solid var(--line);
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
.pad button.on { background: var(--accent); color: #1c1208; }
.pad .jump { width: 120px; font-size: 18px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; max-width: 46em; text-wrap: balance; }
@media (pointer: coarse) {
  .pad { display: flex; }
  .hint.kbd { display: none; }
}
@media (pointer: fine) { .hint.touch { display: none; } }
@media (max-width: 520px) {
  body { font-size: 13px; }
  .hud { padding: 4px 8px; }
}
/* 画面(ステージ)の高さに合わせて、オーバーレイの文字とボタンを縮める。小さいスマホでも、クリア画面がはみ出さない。 */
@supports (width: 1cqh) {
  .stage { container-type: size; }
  .overlay { gap: 3cqh; padding: 4cqh 4cqw; }
  .overlay h1 { font-size: clamp(16px, 11cqh, 42px); }
  .overlay p { font-size: clamp(10px, 6cqh, 16px); line-height: 1.5; }
  .overlay .big { font-size: clamp(12px, 7.5cqh, 24px); }
  .btn { font-size: clamp(13px, 7.5cqh, 20px); padding: clamp(6px, 2.5cqh, 10px) clamp(14px, 6cqw, 28px); }
  .btn.sm { font-size: clamp(11px, 6cqh, 16px); padding: clamp(5px, 2cqh, 8px) clamp(8px, 3cqw, 14px); }
}
</style>
</head>
<body>

<main class="app">
  <header class="hud" aria-live="off">
    <span><b id="hStage">ステージ1</b><span id="hScore">000000</span></span>
    <span><b>カリカリ</b>×<span id="hKib">0</span></span>
    <span><b>ライフ</b><span id="hLife">♥♥♥</span></span>
    <span><b>のこり</b><span id="hTime">300</span></span>
    <button id="mute" type="button" aria-pressed="false">おと ON</button>
  </header>
  <div class="stage">
    <canvas id="c" width="256" height="144" aria-label="サビ猫アドベンチャーのゲーム画面"></canvas>
    <div id="overlay" class="overlay"></div>
  </div>
  <div class="pad" id="pad">
    <div class="dirs">
      <button type="button" data-k="left" aria-label="左へ">◀</button>
      <button type="button" data-k="right" aria-label="右へ">▶</button>
    </div>
    <button type="button" class="jump" data-k="jump" aria-label="ジャンプ">ジャンプ</button>
  </div>
  <p class="hint kbd">← → で移動、スペースでジャンプ。ネズミは上から踏むとやっつけられます。ハテナ箱は下から頭突きするとカリカリが出ます。</p>
  <p class="hint touch">ネズミは上から踏むとやっつけられます。ハテナ箱は下から頭突きするとカリカリが出ます。</p>
</main>

<script>
(() => {
'use strict';
const W = 256, H = 144, GY = 112;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- sprites ---------- */
const PAL = { O:'#e2802c', K:'#18181f', D:'#c46414', W:'#fcfcfc', P:'#fc788c', G:'#9696a5', E:'#c8ec3c', T:'#b0682c', R:'#d82828', B:'#fcd800' };
function mk(rows) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } }));
  return c;
}
const BODY = [
  "..........KK.KO.",
  "..........KKKOKO",
  "..........KOEOEP",
  "K.........KOOKOO",
  "K..KKOKKOOKKOO..",
  "KKOKKOOKKKOOKO..",
  "KOOKKOKKOOOKOK..",
  ".OKKOOKKOKKOOO..",
  "..OKOKKOOKOOK...",
];
const LEGS = {
  A: ["..OK.KO..OK.OK..", "..OK.KO..OK.OK..", "..DD.DD..DD.DD.."],
  B: ["...OK.KO...OK.OK", "...OK.KO...OK.OK", "...DD.DD...DD.DD"],
  J: [".OK.OK....OK.OK.", "OK...........OOK", "DD...........DDD"],
  S: ["..OK.KO..OK.OK..", "..OKKOOKOOKOOK..", "..DDDDDDDDDDDD.."],
};
const CAT = {};
for (const k in LEGS) CAT[k] = mk(BODY.concat(LEGS[k]).map(r => r.padEnd(16, '.').slice(0, 16)));
const MOUSE = {
  A: mk(["......GG.GG.", ".....GGGGGGG", "P...GGGGKGGP", "PP.GGGGGGGGG", ".PGGGGGGGGG.", "..GGGGGGGGG.", "..GG.GG.GG..", "..KK.KK.KK.."]),
  B: mk(["......GG.GG.", ".....GGGGGGG", "P...GGGGKGGP", "PP.GGGGGGGGG", ".PGGGGGGGGG.", "..GGGGGGGGG.", "..G.GG.GG.G.", "..K.KK.KK.K."]),
  F: mk(["............", "............", "............", "............", "............", "PPGGGGGGGGGP", "GGGGGGKGGGGG", "KKKKKKKKKKKK"]),
};
const HEART = mk([".PP.PP.", "PPPPPPP", "PPPPPPP", ".PPPPP.", "..PPP..", "...P..."]);
const BOWL = mk(["...TTT.....", "..TTTTTT...", "RRRRRRRRRRR", ".RRRRRRRRR.", "..RRRRRRR.."]);
const QG = ["..###.", ".#...#", ".....#", "...##.", "...#..", "......", "...#.."];
const DIG = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
  '5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111','+':'000010111010000',
};
function drawSpr(c, x, y, flip) {
  x = Math.round(x); y = Math.round(y);
  if (flip) { ctx.save(); ctx.translate(x + c.width, y); ctx.scale(-1, 1); ctx.drawImage(c, 0, 0); ctx.restore(); }
  else ctx.drawImage(c, x, y);
}
function drawNum(str, x, y, col) {
  for (const pass of [1, 0]) {
    let cx = x;
    for (const ch of str) {
      const g = DIG[ch]; if (!g) continue;
      for (let i = 0; i < 15; i++) if (g[i] === '1') {
        ctx.fillStyle = pass ? '#000' : col;
        ctx.fillRect(cx + (i % 3) + pass, y + ((i / 3) | 0) + pass, 1, 1);
      }
      cx += 4;
    }
  }
}
function disc(cx, cy, rw, rh, col) {
  ctx.fillStyle = col;
  for (let dy = -rh; dy <= rh; dy++) {
    const half = Math.round(rw * Math.sqrt(1 - (dy / rh) * (dy / rh)));
    ctx.fillRect(cx - half, cy + dy, half * 2, 1);
  }
}
const R = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

/* ---------- stages ---------- */
// ステージはここにデータで並べる。増やすときは、この配列に1つ足す。
// boxes: [x, y] / mice: [x, 左はし, 右はし, 向き] / cps: [通過x, 復活x] / gutters・walls: [始まり, 終わり]
const STAGES = [
  { name: 'ゆうがたのまち', short: 'まち', theme: 'town',
    sky: [[110, 150, 224], [252, 204, 164]], cloud: '#ffe4d0',
    world: 1100, goal: 965, time: 300, speed: 22, fall: 'みぞに落ちてしまった…',
    walls: [[0, 200], [360, 520], [600, 790], [850, 1000]],
    gutters: [[304, 336], [704, 736]],
    props: [[236, '#d82828'], [560, '#2864d8'], [900, '#d82828']],
    boxes: [[424, 76], [456, 76], [488, 76], [600, 76], [780, 76], [812, 60]],
    mice: [[210, 150, 270, -1], [560, 520, 620, -1], [660, 630, 690, 1], [880, 840, 940, -1]],
    cps: [[620, 600]],
    music: { step: 0.2, bass: [48, 48, 53, 55],
      mel: [[76,79,76,72,74,76,74,0],[72,76,79,76,81,79,76,0],[77,81,77,74,76,79,76,72],[74,76,77,74,72,72,0,0]] } },
  { name: 'ひるのこうえん', short: 'こうえん', theme: 'park',
    sky: [[96, 170, 240], [206, 238, 255]], cloud: '#ffffff',
    world: 1300, goal: 1165, time: 300, speed: 26, fall: 'いけに落ちてしまった…',
    walls: [[0, 160], [420, 640], [830, 980], [1040, 1200]],
    gutters: [[330, 370], [760, 806], [980, 1020]],
    props: [[250], [560], [900]],
    boxes: [[200, 76], [232, 76], [264, 76], [470, 76], [502, 76], [640, 76], [672, 76], [704, 60], [1060, 76], [1092, 76], [1124, 60]],
    mice: [[200, 140, 300, -1], [480, 440, 540, -1], [640, 570, 700, 1], [900, 850, 950, -1], [1090, 1050, 1130, 1]],
    cps: [[420, 410], [820, 812], [1040, 1030]],
    music: { step: 0.16, bass: [48, 53, 55, 48],
      mel: [[72,74,76,79,76,74,72,0],[74,76,77,81,77,76,74,0],[76,79,83,79,76,72,76,0],[74,77,74,71,72,0,72,0]] } },
  { name: 'よるのしょうてんがい', short: 'よる', theme: 'night',
    sky: [[16, 14, 48], [74, 52, 112]], cloud: null, stars: true,
    world: 1500, goal: 1365, time: 300, speed: 30, fall: 'みぞに落ちてしまった…',
    walls: [[0, 240], [360, 560], [700, 900], [950, 1150], [1230, 1330]],
    gutters: [[300, 344], [640, 686], [900, 944], [1180, 1226]],
    props: [[250, '#d82828'], [520, '#2864d8'], [800, '#2a9a4a'], [1050, '#d82828'], [1300, '#2864d8']],
    boxes: [[180, 76], [212, 76], [244, 76], [420, 76], [452, 76], [484, 76], [760, 76], [792, 60], [1010, 76], [1042, 76], [1074, 60], [1260, 76], [1292, 76]],
    mice: [[200, 130, 270, -1], [440, 400, 520, 1], [580, 540, 625, -1], [780, 730, 870, -1], [1010, 980, 1090, 1], [1130, 1100, 1165, -1], [1300, 1260, 1345, -1]],
    cps: [[360, 352], [700, 694], [960, 952], [1240, 1234]],
    music: { step: 0.24, bass: [45, 41, 43, 45],
      mel: [[69,72,76,72,69,67,64,0],[65,69,72,69,65,64,62,0],[67,71,74,71,67,65,64,0],[64,67,69,67,64,0,57,0]] } },
];
STAGES.forEach(s => { s.poles = []; for (let k = 0; k < Math.ceil(s.world / 128) + 1; k++) s.poles.push(40 + 128 * k); });

/* ---------- background ---------- */
function discOn(g, cx, cy, rw, rh, col) {
  g.fillStyle = col;
  for (let dy = -rh; dy <= rh; dy++) {
    const half = Math.round(rw * Math.sqrt(1 - (dy / rh) * (dy / rh)));
    g.fillRect(cx - half, cy + dy, half * 2, 1);
  }
}
function makeSky(s) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), t = s.sky[0], b = s.sky[1];
  for (let y = 0; y < H; y++) { const u = Math.min(y / GY, 1);
    g.fillStyle = `rgb(${t[0] + (b[0] - t[0]) * u | 0},${t[1] + (b[1] - t[1]) * u | 0},${t[2] + (b[2] - t[2]) * u | 0})`; g.fillRect(0, y, W, 1); }
  if (s.stars) {
    for (let i = 0; i < 36; i++) { g.fillStyle = i % 4 ? '#cfc8ff' : '#ffffff'; g.fillRect((i * 83 + 17) % W, (i * 47 + 5) % 64, 1, 1); }
    discOn(g, 214, 22, 8, 8, '#fff3c8'); discOn(g, 218, 20, 7, 7, 'rgb(27,21,60)');
  }
  return c;
}
const SKIES = STAGES.map(makeSky);
const BCOL = {
  town: ['#786e96', '#96788a', '#6e8296', '#8c8278', '#646e8c'],
  night: ['#3a3470', '#4a3468', '#34426c', '#463c62', '#2e3a66'],
};
const FARCOL = { town: '#9694be', night: '#2c2858' };
const AWNING = ['#e8483c', '#e8b030', '#4aa86a'];
function shade(hex, d) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, v + d)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function building(x, base, w, h, col, win, seed, lit) {
  x = Math.round(x);
  R(x, base - h, w, h, col); R(x, base - h, w, 2, shade(col, 25));
  if (win) for (let wy = base - h + 6; wy < base - 6; wy += 9) for (let wx = x + 4; wx < x + w - 4; wx += 7) {
    const on = ((wx * 7 + wy * 13 + seed) % 5 + 5) % 5 < (lit || 2);
    R(wx, wy, 3, 5, on ? '#fce078' : shade(col, -30));
  }
}
function drawFar(cam, th) {
  if (th === 'park') {
    const h0 = Math.floor(cam * 0.2 / 80) - 1;
    for (let i = h0; i < h0 + 6; i++) disc(Math.round(i * 80 - cam * 0.2 + 40), GY, 52, 22 + (((i * 7) % 3) + 3) % 3 * 6, '#a8dca0');
    return;
  }
  const f0 = Math.floor(cam * 0.2 / 30) - 1;
  for (let i = f0; i < f0 + 11; i++) building(i * 30 - cam * 0.2, GY, 28, 40 + (((i * 53) % 6) + 6) % 6 * 9, FARCOL[th], false, 0);
}
function drawMid(cam, th) {
  const m0 = Math.floor(cam * 0.45 / 46) - 1;
  for (let i = m0; i < m0 + 7; i++) {
    const ii = (i % 5 + 5) % 5, bx = i * 46 - cam * 0.45;
    if (th === 'park') {
      const h = 22 + (((i * 37) % 4) + 4) % 4 * 5, tx = Math.round(bx + 16), pink = ii === 2;
      R(tx - 2, GY - h, 4, h, '#6a4a2c');
      disc(tx, GY - h - 6, 13, 11, pink ? '#f09ab8' : '#3f9a4a');
      disc(tx - 7, GY - h - 1, 9, 8, pink ? '#f6b4cb' : '#4cae56');
      disc(tx + 8, GY - h - 2, 9, 8, pink ? '#e486a8' : '#36883f');
      disc(tx - 3, GY - h - 9, 5, 3, pink ? '#fbd0de' : '#6cc874');
      continue;
    }
    const w = 36 + ((i * 17) % 3 + 3) % 3 * 4, h = 36 + ((i * 37) % 5 + 5) % 5 * 9;
    building(bx, GY, w, h, BCOL[th][ii], true, i, th === 'night' ? 3 : 2);
    if (((i % 3) + 3) % 3 === 0) R(bx + 8, GY - h - 8, 8, 8, th === 'night' ? '#3a3858' : '#5a5a64');
    if (((i % 4) + 4) % 4 === 1) { R(bx + 4, GY - 14, w - 8, 8, th === 'night' ? AWNING[ii % 3] : '#f05a46'); R(bx + 6, GY - 10, w - 12, 1, '#fcf0c8'); }
  }
}
function drawWalls(cam, th) {
  for (const [x0, x1] of S.walls) {
    const s0 = x0 - cam, s1 = x1 - cam; if (s1 < 0 || s0 > W) continue;
    const len = x1 - x0;
    if (th === 'park') {
      R(s0, 90, len, GY - 90, '#3f9a4a'); R(s0, 90, len, 3, '#5cbc64');
      for (let yy = 95, r = 0; yy < GY - 2; yy += 6, r++) for (let xx = x0 + (r % 2 ? 3 : 0); xx < x1; xx += 6) R(xx - cam, yy, 2, 2, '#35893e');
      for (let xx = x0 + 14; xx < x1; xx += 22) R(xx - cam, 96 + (xx % 3) * 5, 2, 2, xx % 2 ? '#fff6f0' : '#f6b4cb');
    } else if (th === 'night') {
      R(s0, 90, len, GY - 90, '#5a5870'); R(s0, 90, len, 3, '#3c3a50');
      for (let yy = 94; yy < GY; yy += 3) R(s0, yy, len, 1, '#48465e');
      for (let gx = x0 + 10, k = 0; gx < x1 - 50; gx += 64, k++) {
        R(gx - cam, 80, 44, 9, '#2a2650'); R(gx - cam + 1, 81, 42, 7, AWNING[k % 3]); R(gx - cam + 5, 83, 34, 3, '#fff3c8');
      }
    } else {
      R(s0, 90, len, GY - 90, '#b2b0aa'); R(s0, 90, len, 3, '#82807c');
      for (let yy = 98; yy < GY; yy += 8) R(s0, yy, len, 1, '#82807c');
      for (let r = 0, yy = 92; yy < GY; yy += 8, r++) for (let xx = x0 + (r % 2 ? 8 : 0); xx < x1; xx += 16) R(xx - cam, yy, 1, 8, '#82807c');
      for (let gx = x0 + 20; gx < x1 - 20; gx += 60) for (const dx of [-6, 0, 6]) disc(gx + dx - cam, 88, 6, 5, '#469646');
    }
  }
}
function drawPoles(cam, th) {
  const poles = S.poles;
  if (th === 'park') {
    for (const px of poles) {

/* ---------- audio ---------- */
let actx = null, master = null, muted = false, musicOn = false, nextBar = 0, musicTimer = 0;
try { muted = localStorage.getItem('sabi-muted') === '1'; } catch (e) {}
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(actx.destination);
  } catch (e) { actx = null; }
}
const mid = n => 440 * Math.pow(2, (n - 69) / 12);
function tone(f, t, d, type, vol, to) {

  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function scheduleMusic() {
  if (!actx || !musicOn) return;
  const M = S.music, u = M.step;
  while (nextBar < actx.currentTime + 0.6) {
    const bar = scheduleMusic.bar++ % 4;
    M.mel[bar].forEach((n, i) => { if (n) tone(mid(n), nextBar + i * u, u * 0.9, 'square', 0.05); });
    for (let q = 0; q < 4; q++) tone(mid(q % 2 ? M.bass[bar] + 7 : M.bass[bar]), nextBar + q * u * 2, u * 1.8, 'triangle', 0.12);

scheduleMusic.bar = 0;

  musicTimer = setInterval(scheduleMusic, 150);
}
function stopMusic() { musicOn = false; clearInterval(musicTimer); }
const sfx = {
  jump() { if (actx) tone(300, actx.currentTime, 0.18, 'square', 0.08, 1200); },
  coin() { if (actx) { const t = actx.currentTime; tone(988, t, 0.07, 'square', 0.09); tone(1319, t + 0.07, 0.4, 'square', 0.09); } },
  stomp() { if (actx) tone(520, actx.currentTime, 0.12, 'square', 0.1, 120); },
  hurt() { if (actx) tone(400, actx.currentTime, 0.4, 'sawtooth', 0.09, 70); },
  win() { if (actx) [72, 76, 79, 84].forEach((n, i) => tone(mid(n), actx.currentTime + i * 0.12, 0.3, 'square', 0.08)); },
  over() { if (actx) [67, 64, 60, 55].forEach((n, i) => tone(mid(n), actx.currentTime + i * 0.2, 0.3, 'triangle', 0.14)); },

/* ---------- state ---------- */
const keys = { left: false, right: false, jump: false, jumpQ: false };
let state = 'title', stageIdx = 0, S = STAGES[0], cat, cam, score, kib, lives, timeLeft, checkpoint, boxes, mice, parts, pops, hearts, clock, winAt, hudCache = '';
// ステージごとのベストと、遊べるステージ数(クリアすると次が増える)。1面のベストは前の版の保存名をそのまま使う。
let bests = STAGES.map(() => 0), unlocked = 1;
const bestKey = i => i === 0 ? 'sabi-best' : 'sabi-best-' + (i + 1);
try {
  bests = STAGES.map((_, i) => +localStorage.getItem(bestKey(i)) || 0);
  unlocked = Math.max(1, Math.min(STAGES.length, +localStorage.getItem('sabi-unlocked') || 1));
} catch (e) {}

}
// carry: 前のステージから持ち越すライフ(なければ3)
function unlockNext() {

}
function loadStage(i, carry) {
  stageIdx = i; S = STAGES[i];
  boxes = S.boxes.map(([x, y]) => ({ x, y, used: false, bump: 0 }));
  mice = S.mice.map(([x, a, b, dir]) => ({ x, a, b, dir, squash: 0 }));
  parts = []; pops = []; hearts = [];
  score = 0; kib = 0; lives = carry || 3; timeLeft = S.time; checkpoint = 40; clock = 0; winAt = 0;

}
function spawn() {

  cam = Math.max(0, Math.min(S.world - W, Math.round(cat.x - 96)));
}
const inGutter = cx => S.gutters.some(([a, b]) => cx > a + 1 && cx < b - 1);
function hurt(fell) {

}

  if (b.used) return;
  b.used = true; b.bump = 0.15; kib++; score += 100; sfx.coin(); popText(b.x + 4, b.y - 8, '+100');
  for (let i = 0; i < 6; i++) parts.push({ x: b.x + 7, y: b.y - 2, vx: (i - 2.5) * 14, vy: -90 - (i % 3) * 18, t: 0 });
}

function update(dt) {
  if (state !== 'play' && state !== 'win') { return; }
  clock += dt;
  for (const b of boxes) if (b.bump > 0) b.bump -= dt;
  for (const p of parts) { p.t += dt; p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.t < 0.9);
  for (const p of pops) p.t += dt;
  pops = pops.filter(p => p.t < 1);
  if (state === 'win') {
    cat.vx = 0; cat.face = 1;
    if (Math.random() < dt * 2.5) hearts.push({ x: cat.x + 8 + Math.random() * 10, y: cat.y, t: 0 });
    for (const h of hearts) { h.t += dt; h.y -= 14 * dt; }
    hearts = hearts.filter(h => h.t < 2.2);
    if (clock - winAt > 1.6 && overlay.hidden) showOverlay('win');
    return;
  }
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; return gameOver('じかんぎれ…'); }
  if (cat.inv > 0) cat.inv -= dt;
  const c = cat;
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const target = dir * 82, acc = dir ? 760 : 900;
  if (c.vx < target) c.vx = Math.min(target, c.vx + acc * dt); else if (c.vx > target) c.vx = Math.max(target, c.vx - acc * dt);

  if ((keys.jump && !c.jumpHeld) || keys.jumpQ) c.buf = 0.14;
  keys.jumpQ = false;
  c.jumpHeld = keys.jump;
  c.buf -= dt;
  c.coyote = c.ground ? 0.12 : c.coyote - dt;
  if (c.buf > 0 && c.coyote > 0) { c.vy = -232; c.ground = false; c.coyote = 0; c.buf = 0; c.cut = false; sfx.jump(); }
  if (!keys.jump && c.vy < -110 && !c.cut) { c.vy *= 0.5; c.cut = true; }
  c.vy = Math.min(c.vy + 620 * dt, 320);

  // horizontal
  let nx = c.x + c.vx * dt;
  nx = Math.max(cam - 2, Math.min(S.world - 14, nx));
  for (const b of boxes) {
    const top = c.y + 1, bot = c.y + 12;
    if (top < b.y + 16 && bot > b.y + 0.5 && nx + 14 > b.x && nx + 2 < b.x + 16) {

    if (!landed && !inGutter(c.x + 8) && prevBottom <= GY + 0.01 && nb >= GY) { ny = GY - 12; landed = true; }
    if (landed) c.vy = 0;
  } else {
    const nt = ny + 1;
    for (const b of boxes) if (Rr > b.x + 1 && L < b.x + 15 && prevTop >= b.y + 15.99 && nt <= b.y + 16) { ny = b.y + 15; c.vy = 20; hitBox(b); }

    if (m.squash < 0) continue;
    m.x += m.dir * S.speed * dt;
    if (m.x < m.a) { m.x = m.a; m.dir = 1; } else if (m.x > m.b) { m.x = m.b; m.dir = -1; }

// 入力は「キーボード」と「画面のパッド」を別々に覚えて、あとで合わせる。
// パッドは1本ずつの指(pointer)を追いかけ、指がボタンの上を動いても、2本同時でも正しく扱う。
const kbdCodes = new Set(), touches = new Map(), padBtns = [...document.querySelectorAll('.pad button')];
const KEYS = ['left', 'right', 'jump'];
function syncKeys() {
  const down = new Set([...touches.values()]);
  for (const k of KEYS) {
    const kb = [...kbdCodes].some(c => MAP[c] === k);
    keys[k] = kb || down.has(k);
  }
  padBtns.forEach(b => b.classList.toggle('on', down.has(b.dataset.k)));
}
function resetInput() { kbdCodes.clear(); touches.clear(); keys.jumpQ = false; syncKeys(); }
addEventListener('keydown', e => {
  const k = MAP[e.code];
  if (!k) return;
  e.preventDefault();
  if (!overlay.hidden) { if (e.code === 'Space' || e.code === 'Enter') { const b = overlay.querySelector('button:not([disabled])'); if (b) b.click(); } return; }
  if (k === 'jump' && !kbdCodes.has(e.code)) keys.jumpQ = true;
  kbdCodes.add(e.code); syncKeys();
});
addEventListener('keyup', e => { if (MAP[e.code]) { kbdCodes.delete(e.code); syncKeys(); } });
addEventListener('blur', resetInput);
const padEl = $('pad');
function padKeyAt(x, y) {
  const m = 6; // 指が少しずれても押せるよう、ボタンの外側も少し判定に入れる
  for (const b of padBtns) {
    const r = b.getBoundingClientRect();
    if (x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m) return b.dataset.k;
  }
  return null;
}
function padTouch(e) {
  const nk = padKeyAt(e.clientX, e.clientY), old = touches.get(e.pointerId);
  if (nk === old && touches.has(e.pointerId)) return;
  touches.set(e.pointerId, nk);
  if (nk === 'jump' && old !== 'jump') keys.jumpQ = true;
  syncKeys();
}
function padRelease(e) { if (touches.delete(e.pointerId)) syncKeys(); }
padEl.addEventListener('pointerdown', e => { e.preventDefault(); try { padEl.setPointerCapture(e.pointerId); } catch (err) {} padTouch(e); });
padEl.addEventListener('pointermove', e => { if (touches.has(e.pointerId)) { e.preventDefault(); padTouch(e); } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => padEl.addEventListener(t, padRelease));
padEl.addEventListener('contextmenu', e => e.preventDefault());
const muteBtn = $('mute');
function applyMute() {
  muteBtn.textContent = muted ? 'おと OFF' : 'おと ON'; muteBtn.setAttribute('aria-pressed', String(muted));
  if (master) master.gain.value = muted ? 0 : 0.5;
}
muteBtn.addEventListener('click', () => {
  muted = !muted; try { localStorage.setItem('sabi-muted', muted ? '1' : '0'); } catch (e) {}
  applyMute(); muteBtn.blur();
});
applyMute();

/* ---------- loop ---------- */
loadStage(0); state = 'title'; showOverlay('title');
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= 1 / 60) { update(1 / 60); acc -= 1 / 60; }
  if (state === 'title') clock += 1 / 60;
  render(); hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
